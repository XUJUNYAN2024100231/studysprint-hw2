services:
  - type: web
    name: studysprint-xujunyan-hw2
    runtime: python
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
